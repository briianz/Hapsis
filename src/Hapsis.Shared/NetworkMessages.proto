syntax = "proto3";

package Hapsis.Shared.Network;

//Identification of the different type of messages
enum MessageType{
	UNKNOWN = 0;
	JOIN_ROOM_REQ = 1;
	JOIN_ROOM_RESP = 2;
	PLAYER_INPUT = 3;
	WORLD_STATE_UPDATE =4;
}

//Wrapper for all the different types of messages
message NetworkEnvelope{
	MessageType type = 1;
	oneof payload{
		JoinRoomRequest	join_room_req = 2;
		JoinRoomResponse join_room_resp = 3;
		PlayerInputMessage player_input = 4;
		WorldStateUpdateMessage world_state_update = 5;
	}
}

//Message sent by the client to request joining a room
message JoinRoomRequest{
	string player_name = 1;
	string room_id = 2;
}

//Message sent by the server in response to a JoinRoomRequest
message JoinRoomResponse{
	bool success = 1;
	int32 player_id = 2;
	string room_id = 3;
	string error_message = 4;
}
//Generic 2D vector input message
message PlayerInputMessage{
	int32 player_id = 1;
	float input_x = 2;
	float input_y = 3;
	uint32 action_flags =4;
}
//State of a single entity in the world
message EntityState{
	int32 entity_id = 1;
	float position_x = 2;
	float position_y = 3;
	float velocity_x = 4;
	float velocity_y = 5;
	float rotation = 6;
}

//Whole world state update message
message WorldStateUpdateMessage{
	uint64 sequence_number = 1;
	repeated EntityState entities = 2;
}